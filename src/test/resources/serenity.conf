webdriver {
  driver = chrome
  base.url = "https://practicesoftwaretesting.com"
  autodownload = true
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = [
        "--start-maximized",
        "--remote-allow-origins=*",
        "--no-sandbox",
        "--disable-dev-shm-usage"
      ]
    }
  }
}

serenity {
  project.name = "Reto Tecnico E-commerce Toolshop"
  take.screenshots = FOR_FAILURES
}

environments {
  default {
    webdriver.base.url = "https://practicesoftwaretesting.com"
  }
}